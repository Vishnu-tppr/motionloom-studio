<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionLoom Live 0.4</title><link rel="stylesheet" href="/src/studio.css"></head>
<body><a class="skip" href="#stage">Skip to canvas</a><div id="app">
<header><div class="brand"><svg aria-label="MotionLoom" viewBox="0 0 32 32"><path d="M6 24V8l10 10L26 8v16"/><circle cx="6" cy="8" r="2"/><circle cx="26" cy="8" r="2"/></svg><b>MotionLoom</b><small>LIVE 0.4</small></div><strong id="project-title"></strong><div class="actions"><span id="status">connecting</span><button id="theme" aria-label="Switch color theme">◐</button><button id="undo" aria-label="Undo">↶</button><button id="redo" aria-label="Redo">↷</button><button id="save" class="primary">Accept changes</button></div></header>
<main><aside class="left"><h2>Scenes</h2><div id="scene-list"></div><h2>Objects</h2><div id="object-list"></div><h2>Motion system</h2><div class="system-card"><b>Persistent token</b><span id="token-state"></span><b>Frame cost</b><span id="frame-cost"></span><b>Layer cache</b><span id="cache-state"></span><b>Render contract</b><span id="contract"></span></div></aside>
<section class="center"><div class="toolbar"><button id="play" aria-label="Play or pause">▶</button><button id="prev" aria-label="Previous frame">‹</button><button id="next" aria-label="Next frame">›</button><time id="timecode"></time><span class="grow"></span><label>Format <select id="format"><option>16:9</option><option>9:16</option><option>1:1</option></select></label><button id="compare">Compare frames</button><button id="render">Render</button></div><div class="stage-shell"><div class="canvas-wrap"><canvas id="stage" tabindex="0" aria-label="Animation preview; click an object to inspect it"></canvas><div id="selection" hidden><span></span><i></i><i></i><i></i><i></i></div></div></div></section>
<aside class="right"><nav><button class="active" data-tab="inspect">Inspect</button><button data-tab="history">History</button><button data-tab="qa">QA</button></nav><section id="inspect" class="tab active"><div id="empty">Select an object in the canvas, object list, or timeline.</div><div id="inspector"></div></section><section id="history" class="tab"><div id="history-list"></div></section><section id="qa" class="tab"><div class="qa-actions"><button id="run-qa">Run project QA</button><button id="temporal-qa">Temporal stability</button><button id="loop-qa">Loop boundary</button></div><pre id="qa-output">No checks run.</pre></section></aside>
<section class="timeline"><div class="timeline-head"><b id="timeline-time">0.00s</b><label>Zoom <input id="zoom" type="range" min="1" max="4" step=".1" value="1"></label></div><div id="timeline-scroll"><div id="ruler"></div><div class="track"><span>Scenes</span><div id="shot-track"></div></div><div class="track"><span>Objects</span><div id="object-track"></div></div><div class="track"><span>Token morph</span><div id="token-track"></div></div><div class="track"><span>Audio cues</span><div id="wave-track"><canvas id="wave"></canvas><div id="cue-layer"></div></div></div><div id="playhead"></div></div></section>
<footer><div class="prompt"><b>✦</b><textarea id="prompt" rows="1" placeholder="Select something, then tell Claude: make this motion slower, more confident, and keep the texture stable…"></textarea><button id="variants">3 variants</button><button id="ask" class="primary">Ask Claude</button></div><div id="proposal" hidden></div></footer></main></div><script type="module" src="/src/studio.js"></script></body></html>
